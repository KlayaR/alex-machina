name: Mise à jour après tirage

# Le Loto est tiré les lundi, mercredi et samedi à 20 h 15 (Paris). Les archives
# CSV de la FDJ sont republiées dans la foulée, avec un délai variable — d'où
# une exécution le soir même et une session de rattrapage le lendemain matin.
# Les heures cron sont en UTC : 21 h 00 UTC = 23 h 00 à Paris l'été, 22 h l'hiver.
on:
  schedule:
    - cron: "0 21 * * 1,3,6"   # soir du tirage
    - cron: "0 6 * * 2,4,0"    # rattrapage le lendemain matin
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/tirage.yml"

concurrency:
  group: tirage
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Récupérer les derniers tirages
        # Si la FDJ est injoignable, on continue : la base est reconstruite
        # depuis data/tirages.csv et le site est republié tel quel.
        continue-on-error: true
        run: python -m alex_machina --db data/loto.sqlite update --full
        env:
          PYTHONPATH: src

      - name: Reconstruire le tableau de bord
        run: python -m alex_machina --db data/loto.sqlite build --output docs
        env:
          PYTHONPATH: src

      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tirages.csv docs
          if git diff --cached --quiet; then
            echo "Rien à committer."
          elif git diff --cached --quiet -- data/tirages.csv; then
            # Le jeu de données n'a pas bougé : seul l'horodatage du site change.
            git commit -m "Régénération du tableau de bord"
            git pull --rebase --autostash && git push
          else
            # Colonnes du jeu de données : date,n,jour,ere,boules,chance,...
            DERNIER=$(tail -n 1 data/tirages.csv | awk -F, '{print $1 " : " $5 " + " $6}')
            git commit -m "Tirage du $DERNIER"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publier:
    needs: mettre-a-jour
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
